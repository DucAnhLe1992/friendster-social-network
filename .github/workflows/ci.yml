name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      MONGODB_URI_TEST: mongodb://localhost:27017
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Type check
        run: npm run typecheck -w @friendster/api

      - name: Lint
        run: npm run lint -w @friendster/api

      - name: Test
        run: npm test -w @friendster/api

      - name: Build
        run: npm run build -w @friendster/api

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint -w @friendster/web

      - name: Test
        run: npm test -w @friendster/web

      - name: Type check and build
        run: npm run build -w @friendster/web

  docker:
    runs-on: ubuntu-latest
    needs: [api, web]
    env:
      JWT_ACCESS_SECRET: ci-only-access-secret-not-for-production-0001
      JWT_REFRESH_SECRET: ci-only-refresh-secret-not-for-production-0002
    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: docker compose build

      - name: Smoke test stack
        run: |
          docker compose up -d --wait --wait-timeout 180
          curl -fsS http://localhost/ | grep -q '<div id="root">'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost/api/auth/me)" = 401

      - name: Logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v

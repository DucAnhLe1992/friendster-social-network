name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: friendster
          POSTGRES_PASSWORD: friendster
          POSTGRES_DB: friendster_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U friendster -d friendster_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL_TEST: postgresql://friendster:friendster@localhost:5432/friendster_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Type check
        run: npm run typecheck -w @friendster/api

      - name: Lint
        run: npm run lint -w @friendster/api

      - name: Check migrations match the schema
        run: |
          npm run db:generate -w @friendster/api
          test -z "$(git status --porcelain apps/api/migrations)"

      - name: Test with coverage
        run: npm run test:coverage -w @friendster/api

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: apps/api/coverage
          if-no-files-found: ignore

      - name: Build
        run: npm run build -w @friendster/api

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint -w @friendster/web

      - name: Test
        run: npm test -w @friendster/web

      - name: Type check and build
        run: npm run build -w @friendster/web

  docker:
    runs-on: ubuntu-latest
    needs: [api, web]
    env:
      COMPOSE_PROFILES: local-db
      POSTGRES_PASSWORD: ci-only-postgres-password
      DATABASE_URL: postgresql://friendster:ci-only-postgres-password@postgres:5432/friendster
      JWT_ACCESS_SECRET: ci-only-access-secret-not-for-production-0001
      JWT_REFRESH_SECRET: ci-only-refresh-secret-not-for-production-0002
      CORS_ORIGIN: http://localhost
    steps:
      - uses: actions/checkout@v4

      - name: Validate migration service environment
        run: |
          docker compose config --format json \
            | jq -e '.services.migrate.environment | has("JWT_ACCESS_SECRET") and has("JWT_REFRESH_SECRET") and has("CORS_ORIGIN")' > /dev/null

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Build images
        run: docker compose build

      - name: Smoke test stack
        run: |
          docker compose up -d --wait --wait-timeout 180
          curl -fsS http://localhost/ | grep -q '<div id="root">'
          curl -fsSI http://localhost/ | grep -qi 'content-security-policy'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost/api/auth/me)" = 401

      - name: Install Playwright
        run: |
          npm ci
          npx -w @friendster/web playwright install --with-deps chromium

      - name: End-to-end tests
        env:
          E2E_BASE_URL: http://localhost
        run: npm run test:e2e -w @friendster/web

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          if-no-files-found: ignore

      - name: Logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v

# Local development without Neon: a Postgres reachable from the host on 127.0.0.1:5432.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: friendster
      POSTGRES_PASSWORD: friendster
      POSTGRES_DB: friendster
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data

volumes:
  postgres_dev_data:

# Production-style stack. Copy .env.example to .env and set real secrets first.
# To run published images instead of building: set IMAGE_PREFIX=<dockerhub user> and IMAGE_TAG=<commit sha>,
# then `docker compose pull && docker compose up -d --no-build`.
# For local development (database only) use: docker compose -f docker-compose.dev.yml up -d
services:
  mongodb:
    image: mongo:7-jammy
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: friendster
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend

  api:
    image: ${IMAGE_PREFIX:-friendster}/friendster-api:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/friendster
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in .env}
      JWT_ACCESS_EXPIRY: ${JWT_ACCESS_EXPIRY:-15m}
      JWT_REFRESH_EXPIRY: ${JWT_REFRESH_EXPIRY:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
    volumes:
      - api_uploads:/app/apps/api/uploads
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - backend
      - frontend

  web:
    image: ${IMAGE_PREFIX:-friendster}/friendster-web:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - frontend

volumes:
  mongodb_data:
  api_uploads:

networks:
  backend:
  frontend:
